<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celtic Bull — Garden Centre, Farm Bistro & Eco Camp | Copper Coast, Co. Waterford</title>
<meta name="description" content="Celtic Bull: a family-run garden centre, organic pet store, farm bistro and eco-camp on Ireland's Copper Coast. Irish hospitality, Polish home-cooking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2EFE3;
    --cream-2:#EAE5D4;
    --sage:#8B9A7A;
    --sage-dark:#5F6E52;
    --sage-pale:#DCE2CE;
    --charcoal:#262620;
    --charcoal-2:#33322B;
    --plum:#6E2E3A;
    --plum-dark:#54212B;
    --gold:#C79A3D;
    --paper:#FBF9F2;
    --ink:#2A2A24;
    --line: rgba(38,38,32,0.14);
    --shadow: 0 18px 40px -22px rgba(38,38,32,0.45);
    --maxw: 1200px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Karla', sans-serif;
    font-size:16.5px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces', serif;
    font-weight:500;
    margin:0 0 0.4em 0;
    letter-spacing:-0.01em;
    color:var(--charcoal);
  }
  p{margin:0 0 1em 0; max-width:62ch;}
  a{color:inherit;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
  :focus-visible{outline:3px solid var(--gold); outline-offset:3px;}

  /* ---------- NAV ---------- */
  header.site-nav{
    position:sticky; top:0; z-index:50;
    background:rgba(242,239,227,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:var(--maxw); margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .brand img{width:40px; height:34px; object-fit:cover; border-radius:6px; filter:contrast(1.05);}
  .brand-text{font-family:'Fraunces', serif; font-weight:600; font-size:1.28rem; color:var(--charcoal); line-height:1;}
  .brand-text small{display:block; font-family:'Karla',sans-serif; font-weight:400; font-size:0.62rem; letter-spacing:0.06em; color:var(--sage-dark); margin-top:3px;}
  nav.links{display:flex; align-items:center; gap:26px;}
  nav.links a{
    text-decoration:none; font-size:0.92rem; color:var(--charcoal-2); font-weight:500;
    padding-bottom:3px; border-bottom:2px solid transparent;
    transition:border-color .2s ease, color .2s ease;
    white-space:nowrap;
  }
  nav.links a:hover{border-color:var(--gold); color:var(--charcoal);}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--plum); color:var(--paper);
    padding:11px 20px; border-radius:3px; text-decoration:none;
    font-weight:600; font-size:0.9rem; font-family:'Karla',sans-serif;
    border:1px solid var(--plum);
    transition:background .2s ease, transform .15s ease;
  }
  .btn:hover{background:var(--plum-dark); transform:translateY(-1px);}
  .btn.ghost{background:transparent; color:var(--charcoal); border:1px solid var(--charcoal);}
  .btn.ghost:hover{background:var(--charcoal); color:var(--paper);}
  .btn.on-dark.ghost{color:var(--paper); border-color:rgba(251,249,242,0.55);}
  .btn.on-dark.ghost:hover{background:var(--paper); color:var(--charcoal);}
  .menu-toggle{display:none; background:none; border:none; cursor:pointer; padding:6px;}
  .menu-toggle span{display:block; width:24px; height:2px; background:var(--charcoal); margin:5px 0;}

<title>Celtic Bull — Garden Centre, Farm Bistro & Eco Camp | Copper Coast, Co. Waterford</title>
<meta name="description" content="Celtic Bull: a family-run garden centre, organic pet store, farm bistro and eco-camp on Ireland's Copper Coast. Irish hospitality, Polish home-cooking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2EFE3;
    --cream-2:#EAE5D4;
    --sage:#8B9A7A;
    --sage-dark:#5F6E52;
    --sage-pale:#DCE2CE;
    --charcoal:#262620;
    --charcoal-2:#33322B;
    --plum:#6E2E3A;
    --plum-dark:#54212B;
    --gold:#C79A3D;
    --paper:#FBF9F2;
    --ink:#2A2A24;
    --line: rgba(38,38,32,0.14);
    --shadow: 0 18px 40px -22px rgba(38,38,32,0.45);
    --maxw: 1200px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Karla', sans-serif;
    font-size:16.5px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces', serif;
    font-weight:500;
    margin:0 0 0.4em 0;
    letter-spacing:-0.01em;
    color:var(--charcoal);
  }
  p{margin:0 0 1em 0; max-width:62ch;}
  a{color:inherit;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
  :focus-visible{outline:3px solid var(--gold); outline-offset:3px;}

  /* ---------- NAV ---------- */
  header.site-nav{
    position:sticky; top:0; z-index:50;
    background:rgba(242,239,227,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:var(--maxw); margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .brand img{width:40px; height:34px; object-fit:cover; border-radius:6px; filter:contrast(1.05);}
  .brand-text{font-family:'Fraunces', serif; font-weight:600; font-size:1.28rem; color:var(--charcoal); line-height:1;}
  .brand-text small{display:block; font-family:'Karla',sans-serif; font-weight:400; font-size:0.62rem; letter-spacing:0.06em; color:var(--sage-dark); margin-top:3px;}
  nav.links{display:flex; align-items:center; gap:26px;}
  nav.links a{
    text-decoration:none; font-size:0.92rem; color:var(--charcoal-2); font-weight:500;
    padding-bottom:3px; border-bottom:2px solid transparent;
    transition:border-color .2s ease, color .2s ease;
    white-space:nowrap;
  }
  nav.links a:hover{border-color:var(--gold); color:var(--charcoal);}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--plum); color:var(--paper);
    padding:11px 20px; border-radius:3px; text-decoration:none;
    font-weight:600; font-size:0.9rem; font-family:'Karla',sans-serif;
    border:1px solid var(--plum);
    transition:background .2s ease, transform .15s ease;
  }
  .btn:hover{background:var(--plum-dark); transform:translateY(-1px);}
  .btn.ghost{background:transparent; color:var(--charcoal); border:1px solid var(--charcoal);}
  .btn.ghost:hover{background:var(--charcoal); color:var(--paper);}
  .btn.on-dark.ghost{color:var(--paper); border-color:rgba(251,249,242,0.55);}
  .btn.on-dark.ghost:hover{background:var(--paper); color:var(--charcoal);}
  .menu-toggle{display:none; background:none; border:none; cursor:pointer; padding:6px;}
  .menu-toggle span{display:block; width:24px; height:2px; background:var(--charcoal); margin:5px 0;}

  /* ---------- HERO ---------- */
